<style>

#stage{position:relative;padding:6px}
#hud{display:flex;justify-content:space-between;align-items:center;padding:2px 8px;font-weight:800;font-size:14px}
#cv{flex:1;min-height:0;width:100%;display:block}

#run{background:#22b455}#rst{background:#f59f00}#clr{background:#e03131}
.pick button{font-size:22px;border:3px solid transparent;background:var(--card);border-radius:12px;cursor:pointer}.pick .on{border-color:#ff3d81}

#ov.on{display:flex}
.box{background:var(--card);border-radius:26px;padding:22px 26px;max-width:480px;width:92%;text-align:center;border:4px solid #ffb703;animation:pop .45s}
.box h3{margin:6px 0 14px;font-size:22px}

#next{background:#7048e8;display:none;margin-top:10px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@media(max-width:860px){#app{grid-template-columns:150px 1fr;grid-template-rows:auto 1fr 1.3fr}#stage{grid-column:1/-1}body{overflow:auto}#app{height:auto;min-height:100%}}
</style>

<body>
<div id="app">
<header><h1>⭐ نُجُومُ القِيَمِ</h1><div class="badge" id="lvb"></div></header>
<aside class="panel"><h2>🧩 البلوكات</h2><div id="pal"></div></aside>
<section class="panel"><h2>🛠️ برنامجي</h2><div id="ws" class="slot" data-uid="root"></div></section>
<section class="panel" id="stage">
<div id="hud"><span id="goal"></span><span id="hearts"></span></div>
<canvas id="cv"></canvas><div id="msg"></div>
<div id="ctl"><button class="btn" id="run">▶ Run</button><button class="btn" id="rst">↺ Reset</button><button class="btn" id="clr">🗑 Clear</button>
<span class="pick"><button id="boy" class="on" aria-label="boy">👦</button><button id="girl" aria-label="girl">👧</button></span></div>
</section>
</div>
<div id="ov"><div class="box"><div style="font-size:46px">🎉⭐🎉</div><h3 id="qt"></h3><div id="qo"></div><button class="btn" id="next">Next Level ➜</button></div></div>

<script>
/* ---------- Levels (add new levels here) ---------- */
const LV=[{
 title:'محبة الأسرة',goal:'🎯 صِل إلى القلب المضيء ثم استخدم Collect',size:6,
 start:{x:0,y:5,d:1},heart:{x:4,y:5},path:[[0,5],[1,5],[2,5],[3,5],[4,5]],
 obs:[{x:1,y:1,k:'house'},{x:2,y:4,k:'tree'},{x:3,y:4,k:'rock'},{x:5,y:3,k:'tree'},{x:0,y:3,k:'tree'},{x:4,y:2,k:'tree'},{x:5,y:5,k:'rock'}],
 deco:[{x:1,y:4},{x:4,y:4},{x:2,y:3},{x:3,y:2},{x:5,y:1},{x:0,y:1}],
 q:'كيف أُعبّر عن محبتي لأسرتي؟',opts:['أساعد أفراد أسرتي وأحترمهم.','أتجاهل أفراد أسرتي.','أرفض التعاون معهم.'],ans:0,reward:'قلب محبة الأسرة'
}];
let lv=0,earned=[],running=false,tok=0,got=false,trail=[],parts=[];
const DX=[0,1,0,-1],DY=[-1,0,1,0],TW=100,TH=50;
const ch={x:0,y:0,d:1,ox:0,oy:0,moving:0,jump:0,tw:0,girl:false};
const $=s=>document.querySelector(s);
/* ---------- Sound ---------- */
let AC;function snd(f,d=.1,ty='sine',v=.07,f2){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;o.type=ty;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.linearRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(AC.destination);o.start();o.stop(t+d)}catch(e){}}
const win_snd=()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>snd(f,.25,'triangle',.09),i*130));
/* ---------- Program model ---------- */
const IC={move:'⬆️',left:'↰',right:'↱',collect:'💖',repeat:'🔁'},NM={move:'Move Forward',left:'Turn Left',right:'Turn Right',collect:'Collect',repeat:'Repeat'};
let U=1,prog={body:[]};
const mk=t=>({uid:'b'+U++,t,n:2,body:t=='repeat'?[]:null});
function find(uid,a=prog.body){for(const b of a){if(b.uid==uid)return b;if(b.body){const r=find(uid,b.body);if(r)return r}}return null}
function detach(uid,a=prog.body){for(let i=0;i<a.length;i++){if(a[i].uid==uid)return a.splice(i,1)[0];if(a[i].body){const r=detach(uid,a[i].body);if(r)return r}}return null}
const getBody=u=>u=='root'?prog.body:find(u).body;
function blkEl(b,pal){const d=document.createElement('div');d.className='blk '+b.t;d.dataset.uid=b.uid||'';d.dataset.t=b.t;
 let h=`<div class="hd"><span class="ic">${IC[b.t]}</span><b>${NM[b.t]}</b>`;
 if(b.t=='repeat'&&!pal)h+=`<span class="cnt"><button data-a="dec">−</button><i>${b.n}</i><button data-a="inc">+</button></span>`;
 if(!pal)h+=`<button class="x" data-a="del">✕</button>`;
 d.innerHTML=h+'</div>';
 if(b.t=='repeat'&&!pal){const s=document.createElement('div');s.className='slot';s.dataset.uid=b.uid;b.body.forEach(c=>s.appendChild(blkEl(c)));d.appendChild(s)}
 return d}
const ws=$('#ws'),pal=$('#pal');
function render(){ws.innerHTML='';prog.body.forEach(b=>ws.appendChild(blkEl(b)))}
['move','left','right','collect','repeat'].forEach(t=>pal.appendChild(blkEl({t},true)));
ws.addEventListener('click',e=>{const bt=e.target.closest('button');if(!bt||running)return;const a=bt.dataset.a,uid=bt.closest('.blk').dataset.uid;
 if(a=='del')detach(uid);else{const b=find(uid);b.n=Math.max(1,Math.min(9,b.n+(a=='inc'?1:-1)))}render()});
/* ---------- Drag & drop (pointer based: mouse + touch) ---------- */
let dr=null;
const slotAt=e=>{const el=document.elementFromPoint(e.clientX,e.clientY);return el&&el.closest('.slot')};
const unhot=()=>document.querySelectorAll('.hot').forEach(s=>s.classList.remove('hot'));
document.addEventListener('pointerdown',e=>{const el=e.target.closest('.blk');if(!el||e.target.closest('button')||running||e.button>0)return;
 dr={pal:!!el.closest('#pal'),t:el.dataset.t,uid:el.dataset.uid,x:e.clientX,y:e.clientY,on:false}});
document.addEventListener('pointermove',e=>{if(!dr)return;
 if(!dr.on){if(Math.hypot(e.clientX-dr.x,e.clientY-dr.y)<6)return;dr.on=true;dr.b=dr.pal?mk(dr.t):detach(dr.uid);if(!dr.pal)render();dr.g=blkEl(dr.b,dr.pal);dr.g.classList.add('ghost');document.body.appendChild(dr.g)}
 dr.g.style.left=e.clientX+'px';dr.g.style.top=e.clientY+'px';unhot();
 const s=slotAt(e);if(s)s.classList.add('hot');else{const el=document.elementFromPoint(e.clientX,e.clientY);if(el&&el.closest('#pal'))pal.classList.add('hot')}
 e.preventDefault()},{passive:false});
function drop(e){if(!dr)return;const d=dr;dr=null;unhot();
 if(!d.on){if(d.pal&&!running){prog.body.push(mk(d.t));render();snd(600,.06)}return}
 d.g.remove();const s=slotAt(e);
 if(s){const kids=[...s.children].filter(c=>c.classList.contains('blk'));const i=kids.filter(k=>{const r=k.getBoundingClientRect();return e.clientY>r.top+r.height/2}).length;getBody(s.dataset.uid).splice(i,0,d.b);snd(520,.07)}else snd(200,.1,'square',.04);
 render()}
document.addEventListener('pointerup',drop);document.addEventListener('pointercancel',drop);
/* ---------- Engine ---------- */
const anim=(ms,fn)=>new Promise(r=>{const s=performance.now();(function f(n){const p=Math.min(1,Math.max(0,(n-s)/ms));fn(p);p<1?requestAnimationFrame(f):r()})(s)});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function say(t){$('#msg').textContent=t}
function hl(uid){document.querySelectorAll('.blk.cur').forEach(e=>{e.classList.remove('cur');e.style.outline=''});if(uid){const e=ws.querySelector(`[data-uid="${uid}"]`);if(e){e.classList.add('cur');e.style.outline='3px solid #ffd43b'}}}
function flatten(a,o){for(const b of a){if(o.length>400)return;if(b.t=='repeat'){for(let i=0;i<b.n;i++)flatten(b.body,o)}else o.push(b)}}
function blocked(x,y){const L=LV[lv];return x<0||y<0||x>=L.size||y>=L.size||L.obs.some(o=>o.x==x&&o.y==y)}
async function exec(b){const L=LV[lv];
 if(b.t=='move'){const nx=ch.x+DX[ch.d],ny=ch.y+DY[ch.d];
  if(blocked(nx,ny)){snd(150,.25,'sawtooth',.06);await anim(320,p=>{const s=Math.sin(p*Math.PI)*.22;ch.ox=DX[ch.d]*s;ch.oy=DY[ch.d]*s});ch.ox=ch.oy=0;say('🚧 لا يمكن المرور من هنا!');return false}
  const sx=ch.x,sy=ch.y;ch.moving=1;snd(380,.14,'triangle',.07,520);
  await anim(400,p=>{ch.x=sx+DX[ch.d]*p;ch.y=sy+DY[ch.d]*p});ch.x=nx;ch.y=ny;ch.moving=0;trail.push([nx,ny]);}
 else if(b.t=='left'||b.t=='right'){ch.d=(ch.d+(b.t=='left'?3:1))%4;snd(700,.12,'square',.04,b.t=='left'?500:900);await anim(320,p=>ch.tw=Math.sin(p*Math.PI));ch.tw=0}
 else{if(ch.x==L.heart.x&&ch.y==L.heart.y&&!got){got=true;snd(880,.3,'sine',.09,1320);burst(...P(ch.x+.5,ch.y+.5),30,-40);await anim(500,()=>{})}
  else{snd(180,.2,'sine',.06);say('🤔 لا يوجد قلب في هذا المربع');await anim(300,()=>{})}}
 return true}
function resetState(){tok++;running=false;const s=LV[lv].start;Object.assign(ch,{x:s.x,y:s.y,d:s.d,ox:0,oy:0,moving:0,jump:0,tw:0});got=false;trail=[[s.x,s.y]];hl();say(LV[lv].goal);$('#run').disabled=false}
async function run(){if(running)return;resetState();const steps=[];flatten(prog.body,steps);if(!steps.length){say('🧩 اسحب بلوكات إلى برنامجي أولًا');return}
 running=true;$('#run').disabled=true;const my=tok;say('🚀 يعمل البرنامج...');
 for(const b of steps){if(my!=tok)return;hl(b.uid);const ok=await exec(b);if(my!=tok)return;if(!ok)break;await sleep(120)}
 hl();running=false;$('#run').disabled=false;
 if(got){win()}else if(!$('#msg').textContent.includes('🚧'))say('💡 لم تجمع كل القلوب بعد! استخدم Collect عند كل قلب')}
function win(){say('🎉 أحسنت! جمعت القلب!');ch.jump=1;win_snd();for(let i=0;i<5;i++)setTimeout(()=>burst(0,0,40,-80,true),i*250);setTimeout(()=>{ch.jump=0;showQ()},1700)}
/* ---------- Quiz ---------- */
function showQ(){const L=LV[lv];$('#qt').textContent=L.q;const qo=$('#qo');qo.innerHTML='';$('#next').style.display='none';
 L.opts.map((t,i)=>({t,i})).sort(()=>Math.random()-.5).forEach(o=>{const b=document.createElement('button');b.className='opt';b.textContent=o.t;
  b.onclick=()=>{if(o.i==L.ans){b.classList.add('ok');snd(784,.3,'triangle',.09,1047);[...qo.children].forEach(c=>c.disabled=true);if(!earned.includes(lv))earned.push(lv);hearts();$('#next').style.display='inline-block';$('#qt').textContent='💖 حصلت على '+L.reward+'!';burst(0,0,40,-80,true)}else{b.classList.add('no');snd(160,.3,'sawtooth',.06)}};qo.appendChild(b)});
 $('#ov').classList.add('on')}
$('#next').onclick=()=>{$('#ov').classList.remove('on');if(lv+1<LV.length){loadLevel(lv+1)}else{say('✨ المرحلة التالية قريبًا — أحسنت يا بطل!')}};
function hearts(){$('#hearts').textContent='قلوب القيم: '+(earned.length?'💖'.repeat(earned.length):'🤍')+' '+earned.length+'/'+LV.length}
function loadLevel(i){lv=i;prog.body=[];render();$('#lvb').textContent=`المرحلة ${i+1}: ${LV[i].title}`;$('#goal').textContent='';hearts();resetState()}
/* ---------- Isometric drawing ---------- */
const cv=$('#cv'),ctx=cv.getContext('2d');let W=0,H=0,dpr=1;
const P=(x,y)=>[(x-y)*TW/2,(x+y)*TH/2];
function fit(){dpr=window.devicePixelRatio||1;W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr}
new ResizeObserver(fit).observe(cv);
function poly(pts,fill,stroke){ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));ctx.closePath();ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.stroke()}}
function tile(x,y,top,l,r,hgt=16){const[cx,cy]=P(x+.5,y+.5),a=TW/2,b=TH/2;
 poly([[cx-a,cy],[cx,cy+b],[cx,cy+b+hgt],[cx-a,cy+hgt]],l);poly([[cx+a,cy],[cx,cy+b],[cx,cy+b+hgt],[cx+a,cy+hgt]],r);poly([[cx,cy-b],[cx+a,cy],[cx,cy+b],[cx-a,cy]],top,'rgba(0,0,0,.08)')}
function ell(x,y,rx,ry,c){ctx.beginPath();ctx.ellipse(x,y,rx,ry,0,0,7);ctx.fillStyle=c;ctx.fill()}
function circ(x,y,r,c){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fillStyle=c;ctx.fill()}
function tree(x,y){const[cx,cy]=P(x+.5,y+.5);ell(cx,cy+4,26,11,'rgba(0,0,0,.2)');ctx.fillStyle='#8d5524';ctx.fillRect(cx-6,cy-30,12,34);circ(cx,cy-46,24,'#2f9e44');circ(cx-14,cy-34,16,'#37b24d');circ(cx+14,cy-36,16,'#40c057');circ(cx-5,cy-58,13,'#51cf66')}
function rock(x,y){const[cx,cy]=P(x+.5,y+.5);ell(cx,cy+4,24,10,'rgba(0,0,0,.2)');ell(cx,cy-8,24,17,'#868e96');ell(cx-6,cy-13,12,8,'#adb5bd')}
function house(x,y){const[cx,cy]=P(x+.5,y+.5),a=36,b=18,h=46;ell(cx,cy+6,44,16,'rgba(0,0,0,.2)');
 poly([[cx-a,cy-h],[cx,cy-h+b],[cx,cy+b],[cx-a,cy]],'#ffe3a3');poly([[cx+a,cy-h],[cx,cy-h+b],[cx,cy+b],[cx+a,cy]],'#ffc971');
 poly([[cx-a-6,cy-h],[cx,cy-h-b-30],[cx+a+6,cy-h],[cx,cy-h+b+4]],'#e8590c');poly([[cx-a-6,cy-h],[cx,cy-h+b+4],[cx,cy-h+b+10],[cx-a-6,cy-h+6]],'#c2410c');
 poly([[cx+6,cy+4],[cx+22,cy-4],[cx+22,cy-26],[cx+6,cy-18]],'#8d5524');poly([[cx-28,cy-14],[cx-12,cy-6],[cx-12,cy-26],[cx-28,cy-34]],'#74c0fc');circ(cx,cy-h-6,5,'#ff6b6b')}
function flower(x,y,t){const[cx,cy]=P(x+.5,y+.5);[[-14,2,'#ff6b9d'],[12,-4,'#ffd43b'],[0,8,'#fff']].forEach(([dx,dy,c],i)=>{const s=Math.sin(t/500+i)*1.5;ctx.strokeStyle='#2b8a3e';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(cx+dx,cy+dy);ctx.lineTo(cx+dx+s,cy+dy-12);ctx.stroke();circ(cx+dx+s,cy+dy-14,4.5,c);circ(cx+dx+s,cy+dy-14,1.8,'#ffa94d')})}
function heartPath(cx,cy,s){ctx.beginPath();ctx.moveTo(cx,cy+s*.9);ctx.bezierCurveTo(cx-s*1.6,cy-s*.2,cx-s*.7,cy-s*1.3,cx,cy-s*.5);ctx.bezierCurveTo(cx+s*.7,cy-s*1.3,cx+s*1.6,cy-s*.2,cx,cy+s*.9)}
function heart(x,y,t){const[cx,cy]=P(x+.5,y+.5),f=Math.sin(t/300)*5,s=15+Math.sin(t/200)*1.5;ell(cx,cy+2,18-f/2,7,'rgba(0,0,0,.2)');

(function(){

let lastKey='',lastAt=0;
function snap(){if(!prof.name||!prof.rid||!(prof.started||earned.length))return null;
 let h=0;LV.forEach((L,i)=>{if(earned.includes(i))h+=L.hearts.length});const done=earned.length>=10;

 const key=r.lv+'|'+r.hearts+'|'+r.done+'|'+r.name+'|'+r.sec,now=Date.now();
 if(!force&&key===lastKey&&now-lastAt<30000)return;lastKey=key;lastAt=now;
 try{fetch(u,{method:'POST',mode:'no-cors',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(r),keepalive:true}).catch(()=>{})}catch(e){}}
